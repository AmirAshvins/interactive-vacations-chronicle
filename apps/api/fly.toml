# First-time: fly launch --no-deploy (from apps/api), then fly secrets set …, then push to main or fly deploy.
app = "ivc-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  build-context = "../.."

[env]
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
